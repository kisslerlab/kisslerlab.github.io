# ─────────────────────────────────────────────────────────────
#  The Kissler Lab — custom Jekyll site
#  Builds natively on GitHub Pages. Edit content in Markdown /
#  the _data/*.yml files; the design lives in _layouts, _includes,
#  and assets/css/main.scss.
# ─────────────────────────────────────────────────────────────

# Site identity
title: "The Kissler Lab"
tagline: "Computational epidemiology at CU Boulder"
description: >-
  The Kissler Lab builds mathematical models, statistical methods, and digital
  tools to make the world more resilient to infectious diseases. Department of
  Computer Science, University of Colorado Boulder.
url: "https://kisslerlab.github.io"
baseurl: ""
email: "stephen.kissler@colorado.edu"
institution: "Department of Computer Science, University of Colorado Boulder"

# Social / profiles (used in footer + people pages)
github_username: "kisslerlab"
scholar_url: "https://scholar.google.com/citations?hl=en&user=09rvmTIAAAAJ"

# Lab lead (used for structured data + fallbacks)
lead:
  name: "Stephen Kissler"
  role: "Principal Investigator · Assistant Professor"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: America/Denver

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - run.txt
  - vendor
  - .bundle
  - "*.key"
  - "*.xcf"

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jemoji

feed:
  path: /feed.xml

# Page defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
