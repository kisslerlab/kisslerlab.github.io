---
layout: default
---
<article class="page">
  <header class="page-head">
    <div class="wrap">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      {% if page.title and page.title != "" %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
      {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap">
    {% if page.wide %}
    <div class="page-body">
      {{ content }}
    </div>
    {% else %}
    <div class="prose">
      {{ content }}
    </div>
    {% endif %}
  </div>
</article>
