---
layout: default
---
<article class="post">
  <header class="page-head">
    <div class="wrap">
      <p class="eyebrow">
        <a href="{{ '/people/StephenKissler/posts' | relative_url }}">Essays</a>
        {% if page.date %}· <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
      </p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.excerpt and page.hide_excerpt != true %}<p class="page-lead">{{ page.excerpt | strip_html }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
